<!DOCTYPE html>
<html lang="uk">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        let myId = localStorage.getItem('hub_user_id');
        if (!myId || myId === 'null') {
            myId = 'User_' + Math.floor(Math.random() * 9000 + 1000);
            localStorage.setItem('hub_user_id', myId);
        }
        if (localStorage.getItem('isHubAdmin') === 'true') {
            document.documentElement.classList.add('force-admin');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMOKE HUB PRO</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMOKE HUB">
    <meta name="theme-color" content="#030305">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --bg-color: #050508; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neon-pink: #ff0055; 
            --neon-blue: #00f0ff; 
            --neon-purple: #7000ff;
            --font-main: 'Outfit', sans-serif;
        }
        
        * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { display: none !important; }

        body {
            margin: 0; min-height: 100vh; padding-bottom: calc(110px + env(safe-area-inset-bottom)); 
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.05) 0%, transparent 50%);
            background-attachment: fixed; font-family: var(--font-main); color: #ffffff;
            -webkit-overflow-scrolling: touch;
        }

        .container { padding: 16px; width: 100%; margin: 0 auto; max-width: 600px; }

        header { 
            display: flex; justify-content: center; align-items: center; 
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px; 
            background: linear-gradient(180deg, rgba(5,5,8,0.9) 0%, rgba(5,5,8,0) 100%);
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { 
            font-weight: 900; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; 
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue), var(--neon-purple)); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: gradient-move 3s linear infinite; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
        }
        @keyframes gradient-move { to { background-position: 200% center; } }

        .head-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: white; padding: 8px 12px; border-radius: 14px; 
            font-size: 13px; font-weight: 700; font-family: var(--font-main);
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.2s;
        }
        .head-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        .update-date {
            text-align: center; font-size: 11px; color: #888; margin-bottom: 16px; 
            font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; 
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .update-date span.date-val { color: var(--neon-blue); background: rgba(0, 240, 255, 0.05); padding: 3px 10px; border-radius: 10px; border: 1px solid rgba(0, 240, 255, 0.2); }

        .sub-nav { display: flex; gap: 10px; overflow-x: auto; padding: 0 4px 15px 4px; margin-bottom: 5px; }
        .sub-nav-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); color: #888; 
            padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-family: var(--font-main); cursor: pointer;
        }
        .sub-nav-btn.active {
            background: rgba(0, 240, 255, 0.1); color: #fff;
            border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .sub-grid { display: none; }
        .sub-grid.active { display: grid; }

        .product-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .product-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 24px; padding: 12px; text-align: center; border: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; position: relative; backdrop-filter: blur(15px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .product-card:active { transform: scale(0.96); border-color: rgba(0, 240, 255, 0.3); }
        .product-img { width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; margin-bottom: 12px; position: relative; background: #0a0a0f; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .product-img img { transform: scale(1.05); }
        
        .product-desc { font-size: 14px; font-weight: 500; min-height: 36px; line-height: 1.2; margin: 0 0 10px; color: #e0e0e0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price { 
            font-weight: 900; font-size: 16px; margin-top: auto; 
            background: linear-gradient(90deg, #fff, var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            padding: 8px; border-radius: 12px; background-color: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.1);
        }
        
        /* КНОПКА КОШИКА */
        .add-to-cart-btn {
            background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.2);
            color: white; border-radius: 10px; padding: 8px; margin-top: 10px;
            font-family: var(--font-main); font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .add-to-cart-btn:active { transform: scale(0.95); background: rgba(0, 240, 255, 0.2); }
        .out-of-stock .add-to-cart-btn { display: none; }

        /* CART UI */
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 16px; margin-bottom: 12px;
        }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .cart-item-price { color: var(--neon-blue); font-size: 13px; font-weight: 900; }
        .cart-controls { display: flex; gap: 8px; align-items: center; }
        .cart-btn-min, .cart-btn-plus { 
            background: rgba(255,255,255,0.1); border: none; color: white; 
            width: 30px; height: 30px; border-radius: 8px; font-weight: bold; cursor: pointer; 
        }
        .checkout-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 16px; color: white; margin-bottom: 12px; font-size: 14px; font-family: var(--font-main); font-weight: 500; outline: none; }
        .checkout-input:focus { border-color: var(--neon-blue); }
        .checkout-submit { 
            width: 100%; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            color: #fff; border: none; padding: 18px; border-radius: 16px; font-weight: 900; 
            text-transform: uppercase; margin-top: 10px; cursor: pointer; box-shadow: 0 5px 20px rgba(0, 240, 255, 0.3);
        }

        .badge { position: absolute; top: 10px; left: 10px; padding: 5px 12px; border-radius: 10px; font-size: 10px; font-weight: 900; z-index: 5; display: none; text-transform: uppercase; color: white; letter-spacing: 1px; backdrop-filter: blur(5px); }
        .badge-hit { display: block !important; background: linear-gradient(135deg, var(--neon-pink), #ff5e00); box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); }
        .badge-promo { display: block !important; background: linear-gradient(135deg, #ffd900, #ff8c00); color: #000; box-shadow: 0 4px 15px rgba(255, 217, 0, 0.3); }
        .badge-new { display: block !important; background: linear-gradient(135deg, #00ff99, #00ccff); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); color: #000;}
        
        .out-of-stock { opacity: 0.8; filter: grayscale(0.5); }
        .out-of-stock .product-img::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 8; }
        .out-of-stock::after { 
            content: attr(data-out-of-stock-text); position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); 
            background: rgba(255, 0, 85, 0.15); border: 1px solid var(--neon-pink); padding: 8px 18px; border-radius: 14px; font-size: 13px; font-weight: 900; 
            color: var(--neon-pink); z-index: 10; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(255,0,85,0.4); text-transform: uppercase;
        }

        .bottom-nav { 
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px;
            background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; padding: 10px; border-radius: 28px; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02) inset;
        }
        .nav-item { 
            background: transparent; border: none; color: #666; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; gap: 4px; font-family: var(--font-main); padding: 8px 12px; border-radius: 20px; transition: 0.3s; position: relative;
        }
        .nav-item span:first-child { font-size: 20px; filter: grayscale(1); opacity: 0.5; transition: 0.3s; }
        .nav-item.active { background: rgba(255,255,255,0.08); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
        .nav-item.active span:first-child { filter: grayscale(0); opacity: 1; transform: scale(1.15); }
        .nav-cart-badge { 
            position: absolute; top: 0px; right: 0px; background: var(--neon-pink); color: white; 
            border-radius: 50%; min-width: 18px; height: 18px; font-size: 10px; font-weight: 900; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(255,0,85,0.5);
        }

        .promo-slider { width: 100%; height: 160px; margin-bottom: 24px; border-radius: 28px; overflow: hidden; position: relative; border: 1px solid var(--glass-border); box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; }
        .promo-track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .promo-slide { min-width: 100%; position: relative; }
        .promo-slide img { width: 100%; height: 100%; object-fit: cover; }
        .promo-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,8,0.8) 0%, transparent 100%); }

        .lang-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); z-index: 1000001; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .lang-modal-content { background: rgba(15, 15, 20, 0.8); border: 1px solid var(--glass-border); padding: 32px 24px; border-radius: 32px; text-align: center; width: 85%; max-width: 340px; transform: scale(0.9); transition: transform 0.4s; }
        .lang-modal-overlay.active { opacity: 1; display: flex; }
        .lang-modal-overlay.active .lang-modal-content { transform: scale(1); }
        .lang-options { display: grid; gap: 14px; }
        .lang-options button { background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); color: white; border: 1px solid var(--glass-border); padding: 18px; border-radius: 20px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; cursor:pointer; }
        .lang-options button:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }

        /* ADMIN PANEL */
        .dev-panel { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; 
            background: rgba(10, 10, 14, 0.95); backdrop-filter: blur(25px); padding: calc(24px + env(safe-area-inset-top)) 24px 100px; 
            transition: right 0.5s; z-index: 2000; border-left: 1px solid rgba(255, 255, 255, 0.05); overflow-y: auto; 
        }
        .dev-panel.active { right: 0; }
        .admin-section-title { font-size: 11px; font-weight: 900; color: #666; text-transform: uppercase; letter-spacing: 2px; margin: 24px 0 16px; display: flex; align-items: center; gap: 10px; }
        .admin-section-title::after { content: ''; height: 1px; flex: 1; background: rgba(255,255,255,0.05); }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .admin-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); color: #ccc; padding: 16px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .admin-btn.active-mode { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); }
        .admin-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 16px; color: white; margin-bottom: 12px; outline: none; }
        .save-all-btn { grid-column: span 2; background: linear-gradient(90deg, var(--neon-blue), #0077ff); color: #fff; border: none; padding: 18px; border-radius: 20px; font-weight: 900; margin-top: 10px; cursor: pointer; }

        .hidden { display: none !important; }
        [contenteditable="true"] { outline: none; background: rgba(0, 240, 255, 0.1); border-radius: 8px; padding: 4px; box-shadow: inset 0 0 0 1px var(--neon-blue); }
        html.hide-sold-active:not(.force-admin) .product-card.out-of-stock { display: none !important; }
        html.force-admin.hide-sold-active .product-card.out-of-stock { display: flex !important; opacity: 0.3; }
        @keyframes jiggle { 0% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } 100% { transform: rotate(-1.5deg); } }
        .reorder-mode .product-card { animation: jiggle 0.35s infinite ease-in-out; }
    </style>
</head>
<body>

<div id="language-modal" class="lang-modal-overlay">
    <div class="lang-modal-content">
        <div class="logo" style="font-size: 28px; margin-bottom: 15px;">SMOKE HUB</div>
        <h3 style="font-size: 15px; color: #888; margin-bottom: 25px;">Оберіть мову / Wybierz język</h3>
        <div class="lang-options">
            <button onclick="selectInitialLang('ua')">🇺🇦 Українська</button>
            <button onclick="selectInitialLang('pl')">🇵🇱 Polski</button>
        </div>
    </div>
</div>

<div id="category-start-modal" class="lang-modal-overlay">
    <div class="lang-modal-content">
        <div class="logo" style="font-size: 28px; margin-bottom: 15px;">SMOKE HUB</div>
        <h3 style="font-size: 15px; color: #888; margin-bottom: 25px;">Що вас цікавить? / Co Cię interesuje?</h3>
        <div class="lang-options" style="grid-template-columns: 1fr 1fr; gap: 14px;">
            <button onclick="selectInitialCategory('zalivka')" style="flex-direction: column; padding: 24px 10px;">
                <span style="font-size: 36px;">💧</span> <span data-i18n="zalivka">Жижа</span>
            </button>
            <button onclick="selectInitialCategory('prodazh')" style="flex-direction: column; padding: 24px 10px;">
                <span style="font-size: 36px;">🟢</span> <span data-i18n="prodazh">Снюс</span>
            </button>
        </div>
    </div>
</div>

<header>
    <button id="lang-toggle-mini" class="head-btn" style="position: absolute; left: 20px; display: flex; align-items: center; gap: 6px;">
        <span id="lang-flag">🇺🇦</span> <span id="lang-label">UA</span>
    </button>
    <div class="logo">SMOKE HUB</div>
    <button id="admin-trigger" class="head-btn" style="position: absolute; right: 20px; border: none; background: transparent; font-size: 22px; padding: 4px;">⚙️</button>
</header>
   
<div class="container" id="main-container">
    <div class="update-date">
        <span data-i18n="updated">Оновлено:</span>
        <span class="date-val" id="last-update-date">...</span>
    </div>

    <div class="promo-slider" id="main-banner">
        <div class="promo-track" id="promoTrack">
            <div class="promo-slide">
                <img src="images/banner.gif" alt="promo" onerror="this.style.display='none'">
                <div class="promo-overlay"></div>
            </div>
        </div>
    </div>

    <!-- КАТЕГОРІЯ: ЖИЖА -->
    <div id="cat-zalivka" class="cat-section">
        <div class="sub-nav">
            <button class="sub-nav-btn active" data-target="zalivka-elfliq">Elfliq</button>
            <button class="sub-nav-btn" data-target="zalivka-chaserlux">Chaser Lux</button>
            <button class="sub-nav-btn" data-target="zalivka-chaserpods">Chaser for pods</button>
            <button class="sub-nav-btn" data-target="zalivka-chaserblack">Chaser Black</button>
        </div>
        <div class="product-grid sub-grid active" id="grid-zalivka-elfliq"></div>
        <div class="product-grid sub-grid" id="grid-zalivka-chaserlux"></div>
        <div class="product-grid sub-grid" id="grid-zalivka-chaserpods"></div>
        <div class="product-grid sub-grid" id="grid-zalivka-chaserblack"></div>
    </div>

    <!-- КАТЕГОРІЯ: СНЮС -->
    <div id="cat-prodazh" class="cat-section hidden">
        <div class="sub-nav">
            <button class="sub-nav-btn active" data-target="prodazh-cuba">Cuba</button>
            <button class="sub-nav-btn" data-target="prodazh-barron">Barron</button>
        </div>
        <div class="product-grid sub-grid active" id="grid-prodazh-cuba"></div>
        <div class="product-grid sub-grid" id="grid-prodazh-barron"></div>
    </div>

    <!-- КАТЕГОРІЯ: КАТРИДЖІ -->
    <div id="cat-aktsii" class="cat-section hidden">
        <div class="product-grid sub-grid active" id="grid-aktsii"></div>
    </div>

    <!-- РОЗДІЛ: КОШИК -->
    <div id="cat-cart" class="cat-section hidden">
        <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase;" data-i18n="cart_title">🛒 Ваш кошик</h2>
        
        <div id="cart-items-container"></div>
        
        <div id="cart-empty-msg" style="text-align:center; color:#888; padding: 40px 0;" data-i18n="empty">Кошик порожній</div>
        
        <div id="cart-summary" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin: 20px 0; padding: 15px; background: rgba(0, 240, 255, 0.05); border-radius: 16px; border: 1px solid rgba(0, 240, 255, 0.2);">
                <span data-i18n="total" style="font-size: 16px; font-weight: 700;">Разом до сплати:</span>
                <span id="cart-total-price" style="color:var(--neon-blue); font-size: 20px; font-weight: 900;">0</span>
            </div>
            
            <input type="text" id="order-name" class="checkout-input" placeholder="Ваше ім'я" data-i18n-ph="name">
            <input type="text" id="order-phone" class="checkout-input" placeholder="Телефон або Telegram" data-i18n-ph="phone">
            
            <!-- НОВЕ ПОЛЕ: МІСТО -->
            <input type="text" id="order-city" class="checkout-input" placeholder="Місто відправки (Пошта)" data-i18n-ph="city">
            
            <!-- ВИБІР ВАЛЮТИ ОПЛАТИ -->
            <select id="order-currency" class="checkout-input">
                <option value="PLN">🇵🇱 Оплата в PLN (Злоті)</option>
                <option value="UAH">🇺🇦 Оплата в UAH (Гривня)</option>
            </select>
            
            <button id="submit-order-btn" class="checkout-submit" data-i18n="order_btn">🚀 ОФОРМИТИ ЗАМОВЛЕННЯ</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" data-tab="zalivka"><span>💧</span><span data-i18n="zalivka">Жижа</span></button>
    <button class="nav-item" data-tab="prodazh"><span>🟢</span><span data-i18n="prodazh">Снюс</span></button>
    <button class="nav-item" data-tab="aktsii"><span>⚡</span><span data-i18n="other">Катриджі</span></button>
    <button class="nav-item" data-tab="cart">
        <span>🛒</span><span data-i18n="cart">Кошик</span>
        <div class="nav-cart-badge hidden" id="cart-badge">0</div>
    </button>
</nav>

<!-- ADMIN PANEL -->
<div id="dev-menu" class="dev-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div class="logo" style="font-size: 22px;">HUB CONTROL</div>
        <button onclick="document.getElementById('dev-menu').classList.remove('active')" style="background:rgba(255,255,255,0.1); border:none; color:white; width: 36px; height: 36px; border-radius: 50%; font-size:18px; cursor: pointer;">×</button>
    </div>

    <!-- ЗАМОВЛЕННЯ -->
    <div class="admin-section-title">📥 ОСТАННІ ЗАМОВЛЕННЯ</div>
    <div id="admin-orders-list" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
        <div style="color: #888; font-size: 13px;">Завантаження...</div>
    </div>

    <div class="admin-section-title">🆕 Додати товар</div>
    <div style="background: rgba(255,255,255,0.02); padding: 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);">
        <select id="new-prod-cat" class="admin-input">
            <optgroup label="💧 Жижа">
                <option value="zalivka-elfliq">Elfliq</option>
                <option value="zalivka-chaserlux">Chaser Lux</option>
                <option value="zalivka-chaserpods">Chaser for pods</option>
                <option value="zalivka-chaserblack">Chaser Black</option>
            </optgroup>
            <optgroup label="🟢 Снюс">
                <option value="prodazh-cuba">Cuba</option>
                <option value="prodazh-barron">Barron</option>
            </optgroup>
            <optgroup label="⚡ Катриджі">
                <option value="aktsii">Катриджі</option>
            </optgroup>
        </select>
        <input type="text" id="new-prod-name" placeholder="Назва" class="admin-input">
        <input type="text" id="new-prod-price" placeholder="Ціна (напр. 60 zł)" class="admin-input">
        <input type="text" id="new-prod-img" placeholder="URL фото" class="admin-input">
        <button class="admin-btn" id="add-product-btn" style="width:100%; background: linear-gradient(90deg, var(--neon-pink), #ff5e00); color:#fff; border:none; margin-top:10px;">➕ ДОДАТИ ТОВАР</button>
    </div>

    <div class="admin-section-title">📦 Управління вітриною</div>
    <div class="admin-grid">
        <button class="admin-btn" id="edit-price">💰 Ціни</button>
        <button class="admin-btn" id="edit-desc">📝 Назви</button>
        <button class="admin-btn" id="edit-stock">📦 Наявність</button>
        <button class="admin-btn" id="edit-badge">🏷️ Стікери</button>
        <button class="admin-btn" id="edit-img-mode">📸 Фото</button>
        <button class="admin-btn" id="edit-reorder">↕️ Порядок</button>
        <button class="admin-btn" id="edit-delete" style="color: #ff3366; border-color: rgba(255, 51, 102, 0.3);">🗑️ Видалити</button>
        
        <select id="badge-selector" class="admin-input" style="grid-column: span 2; margin: 8px 0 0;">
            <option value="">Без стікера</option>
            <option value="hit">🔥 ХІТ</option>
            <option value="promo">🏷️ АКЦІЯ</option>
            <option value="new">🆕 НОВИНКА</option>
        </select>
        <button class="save-all-btn" id="save-all">💾 ЗБЕРЕГТИ ЗМІНИ</button>
    </div>

    <div class="admin-section-title">📅 Дата оновлення</div>
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="text" id="admin-update-date" class="admin-input" style="margin-bottom: 0;" placeholder="Напр. 24.07.2026">
        <button class="admin-btn" id="save-date-btn" style="padding: 0 20px; font-size: 18px;">💾</button>
    </div>

    <div class="admin-section-title">⚙️ Система</div>
    <div class="admin-grid">
        <button class="admin-btn" id="toggle-hide-sold">🚫 Ховати Sold</button>
        <button class="admin-btn" id="toggle-banner">🖼️ Банер</button>
    </div>

    <button class="admin-btn" style="width:100%; margin-top:40px; background:transparent; border-color:rgba(255,255,255,0.1); color: #888;" onclick="localStorage.clear(); location.reload();">🚪 Вийти з адмінки</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://smokehub-7a072-default-rtdb.firebaseio.com/" });
    const db = getDatabase(app);
    const isAdmin = () => localStorage.getItem('isHubAdmin') === 'true';

    // --- ЛОКАЛІЗАЦІЯ ---
    const translations = {
        ua: { 
            zalivka: "Жижа", prodazh: "Снюс", other: "Катриджі", cart: "Кошик",
            sold: "ПРОДАНО", badge_hit: "ХІТ", badge_promo: "АКЦІЯ", badge_new: "НОВИНКА", updated: "Оновлено:",
            cart_title: "🛒 Ваш кошик", empty: "Кошик порожній 😔", total: "Разом до сплати:", 
            add_cart: "В кошик", name: "Ваше ім'я", phone: "Телефон або Telegram", city: "Місто відправки (Пошта)", order_btn: "🚀 ОФОРМИТИ ЗАМОВЛЕННЯ",
            order_success: "✅ Замовлення успішно відправлено! Ми зв'яжемося з вами."
        },
        pl: { 
            zalivka: "Liquid", prodazh: "Snus", other: "Kartridże", cart: "Koszyk",
            sold: "SPRZEDANE", badge_hit: "HIT", badge_promo: "PROMOCJA", badge_new: "NOWOŚĆ", updated: "Aktualizacja:",
            cart_title: "🛒 Twój koszyk", empty: "Koszyk jest pusty 😔", total: "Do zapłaty:", 
            add_cart: "Do koszyka", name: "Twoje imię", phone: "Telefon lub Telegram", city: "Miasto wysyłki (Paczkomat)", order_btn: "🚀 ZŁÓŻ ZAMÓWIENIE",
            order_success: "✅ Zamówienie wysłane pomyślnie! Skontaktujemy się z Tobą."
        }
    };

    let currentLang = localStorage.getItem("lang") || "ua";

    function applyLang(lang) {
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.dataset.i18n;
            if (translations[lang][key]) el.innerText = translations[lang][key];
        });
        document.querySelectorAll("[data-i18n-ph]").forEach(el => {
            const key = el.dataset.i18nPh;
            if (translations[lang][key]) el.placeholder = translations[lang][key];
        });
        document.querySelectorAll('.product-card').forEach(card => {
            card.setAttribute('data-out-of-stock-text', translations[lang].sold);
            const badgeDiv = card.querySelector('.badge');
            const bType = card.getAttribute('data-badge');
            if (bType && translations[lang]['badge_' + bType]) badgeDiv.innerText = translations[lang]['badge_' + bType];
            
            const btn = card.querySelector('.add-to-cart-btn');
            if(btn) btn.innerText = translations[lang].add_cart;
        });
        const langLabel = document.getElementById("lang-label");
        const langFlag = document.getElementById("lang-flag");
        if(langLabel) { langLabel.innerText = lang.toUpperCase(); langFlag.innerText = lang === "ua" ? "🇺🇦" : "🇵🇱"; }
        localStorage.setItem("lang", lang); currentLang = lang;
        renderCart(); 
    }

    // --- МОДАЛКИ ---
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.style.opacity = '0'; modal.querySelector('.lang-modal-content').style.transform = 'scale(0.9)';
        setTimeout(() => { modal.classList.remove('active'); modal.style = ''; }, 300);
    }
    window.selectInitialLang = (lang) => { applyLang(lang); closeModal('language-modal'); setTimeout(() => openModal('category-start-modal'), 300); };
    window.selectInitialCategory = (tab) => { closeModal('category-start-modal'); setTimeout(() => { document.querySelector(`.nav-item[data-tab="${tab}"]`)?.click(); }, 300); };
    
    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang");
        if (!savedLang) setTimeout(() => openModal('language-modal'), 100);
        else { applyLang(savedLang); setTimeout(() => openModal('category-start-modal'), 100); }
    });

    document.getElementById("lang-toggle-mini")?.addEventListener("click", () => {
        currentLang = currentLang === "ua" ? "pl" : "ua"; applyLang(currentLang);
    });

    // --- НАВІГАЦІЯ ---
    let currentBannerStatus = true;
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.cat-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('cat-' + tab).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            
            const banner = document.getElementById('main-banner');
            if (banner) banner.style.display = (tab === 'cart' || !currentBannerStatus) ? 'none' : 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    });

    document.querySelectorAll('.sub-nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const parent = e.target.closest('.cat-section');
            parent.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            parent.querySelectorAll('.sub-grid').forEach(g => g.classList.remove('active'));
            e.target.classList.add('active'); parent.querySelector('#grid-' + e.target.dataset.target).classList.add('active');
        });
    });

    // --- КОШИК (ЛОГІКА) ---
    let cart = JSON.parse(localStorage.getItem('hub_cart')) || [];
    
    function saveCart() {
        localStorage.setItem('hub_cart', JSON.stringify(cart));
        updateCartBadge();
        renderCart();
    }

    function updateCartBadge() {
        const badge = document.getElementById('cart-badge');
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        if(totalItems > 0) { badge.innerText = totalItems; badge.classList.remove('hidden'); }
        else { badge.classList.add('hidden'); }
    }

    function getPriceNum(priceStr, selectedCurrency) {
        if (!priceStr) return 0;
        const matches = priceStr.match(/\d+([.,]\d+)?/g);
        if (!matches) return 0;
        if (selectedCurrency === 'UAH' && matches.length > 1) {
            return parseFloat(matches[1].replace(',', '.'));
        }
        return parseFloat(matches[0].replace(',', '.'));
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const emptyMsg = document.getElementById('cart-empty-msg');
        const summary = document.getElementById('cart-summary');
        const totalEl = document.getElementById('cart-total-price');
        
        const currSelect = document.getElementById('order-currency');
        const selectedCurrency = currSelect ? currSelect.value : 'PLN';
        
        container.innerHTML = '';
        if(cart.length === 0) {
            emptyMsg.classList.remove('hidden'); summary.classList.add('hidden');
        } else {
            emptyMsg.classList.add('hidden'); summary.classList.remove('hidden');
            let totalSum = 0;
            
            cart.forEach((item, index) => {
                const itemPriceNum = getPriceNum(item.price, selectedCurrency);
                totalSum += itemPriceNum * item.qty;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price}</div>
                    </div>
                    <div class="cart-controls">
                        <button class="cart-btn-min" data-idx="${index}">-</button>
                        <span>${item.qty}</span>
                        <button class="cart-btn-plus" data-idx="${index}">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
            totalEl.innerText = `${totalSum.toFixed(2)} ${selectedCurrency}`;
        }
    }

    const orderCurrencyEl = document.getElementById('order-currency');
    if (orderCurrencyEl) {
        orderCurrencyEl.addEventListener('change', renderCart);
    }

    document.getElementById('cart-items-container').addEventListener('click', e => {
        if(e.target.classList.contains('cart-btn-plus')) {
            cart[e.target.dataset.idx].qty++; saveCart();
        } else if(e.target.classList.contains('cart-btn-min')) {
            const idx = e.target.dataset.idx;
            cart[idx].qty--;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            saveCart();
        }
    });

    document.getElementById('submit-order-btn').onclick = async () => {
        const name = document.getElementById('order-name').value.trim();
        const phone = document.getElementById('order-phone').value.trim();
        const city = document.getElementById('order-city').value.trim(); // Отримуємо місто
        const currency = document.getElementById('order-currency').value; 
        
        if(!name || !phone || !city) return alert("Будь ласка, заповніть всі поля для відправки!");

        const orderData = {
            user: name, contact: phone, city: city, items: cart,
            total: document.getElementById('cart-total-price').innerText,
            payCurrency: currency,
            date: new Date().toLocaleString('uk-UA'), status: 'new'
        };

        const btn = document.getElementById('submit-order-btn');
        btn.innerText = "⏳ Відправка..."; btn.disabled = true;

        try {
            await push(ref(db, 'orders'), orderData);
            alert(translations[currentLang].order_success);
            cart = []; saveCart();
            document.getElementById('order-name').value = '';
            document.getElementById('order-phone').value = '';
            document.getElementById('order-city').value = ''; // Очищаємо поле міста
            document.querySelector('.nav-item[data-tab="zalivka"]').click();
        } catch (e) { alert("Помилка відправки. Спробуйте ще раз."); }
        
        btn.innerText = translations[currentLang].order_btn; btn.disabled = false;
    };

    updateCartBadge(); renderCart();

    // --- FIREBASE РЕНДЕР КАТАЛОГУ ---
    const categoriesList = ['zalivka-elfliq', 'zalivka-chaserlux', 'zalivka-chaserpods', 'zalivka-chaserblack', 'prodazh-cuba', 'prodazh-barron', 'aktsii'];

    onValue(ref(db, 'catalog'), (snap) => {
        const data = snap.val(); if (!data) return;
        categoriesList.forEach(cat => {
            const grid = document.getElementById(`grid-${cat}`); if (!grid) return;
            grid.innerHTML = ''; 
            const catData = data[cat];
            if (catData && catData.descs) {
                catData.descs.forEach((name, i) => {
                    const price = catData.prices?.[i] || "";
                    const card = document.createElement('div');
                    card.className = `product-card ${catData.stock?.[i] === false ? 'out-of-stock' : ''}`;
                    const bType = catData.badges?.[i]; if (bType) card.setAttribute('data-badge', bType);
                    card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
                    const badgeHtml = bType ? `<div class="badge badge-${bType}">${translations[currentLang]['badge_' + bType] || ""}</div>` : '<div class="badge"></div>';

                    card.innerHTML = `
                        <div class="product-img">${badgeHtml}<img src="${catData.imgs?.[i] || 'images/logo.png'}"></div>
                        <h3 class="product-desc">${name}</h3>
                        <div class="price">${price}</div>
                        <button class="add-to-cart-btn" data-name="${name}" data-price="${price}">${translations[currentLang].add_cart}</button>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    });

    // ДОДАВАННЯ В КОШИК (Клік по кнопці)
    document.addEventListener('click', e => {
        if(e.target.classList.contains('add-to-cart-btn')) {
            if(isAdmin() && mode !== null) return; // Блокуємо, якщо включений режим редагування
            const name = e.target.dataset.name;
            const price = e.target.dataset.price;
            const existing = cart.find(i => i.name === name);
            if(existing) existing.qty++;
            else cart.push({ name, price, qty: 1 });
            saveCart();
            
            // Анімація кнопки
            const origText = e.target.innerText;
            e.target.innerText = "✅ Додано"; e.target.style.background = "rgba(0, 255, 153, 0.2)";
            setTimeout(() => { e.target.innerText = origText; e.target.style.background = ""; }, 1000);
        }
    });

    // --- АДМІНКА: РЕДАГУВАННЯ ТА ЗАМОВЛЕННЯ ---
    let mode = null;
    function updateModeBtns(activeBtn) {
        document.querySelectorAll('.admin-btn').forEach(b => b.classList.remove('active-mode'));
        if (mode) activeBtn.classList.add('active-mode');
    }

    document.getElementById('edit-price').onclick = (e) => { mode = mode === 'price' ? null : 'price'; document.querySelectorAll('.price').forEach(el => el.contentEditable = (mode === 'price')); updateModeBtns(e.target); };
    document.getElementById('edit-desc').onclick = (e) => { mode = mode === 'desc' ? null : 'desc'; document.querySelectorAll('.product-desc').forEach(el => el.contentEditable = (mode === 'desc')); updateModeBtns(e.target); };
    document.getElementById('edit-stock').onclick = (e) => { mode = mode === 'stock' ? null : 'stock'; updateModeBtns(e.target); };
    document.getElementById('edit-badge').onclick = (e) => { mode = mode === 'badge' ? null : 'badge'; updateModeBtns(e.target); };
    document.getElementById('edit-img-mode').onclick = (e) => { mode = mode === 'img' ? null : 'img'; updateModeBtns(e.target); };
    document.getElementById('edit-delete').onclick = (e) => { mode = mode === 'delete' ? null : 'delete'; updateModeBtns(e.target); };

    document.addEventListener('click', (e) => {
        const card = e.target.closest('.product-card');
        if(!card || !isAdmin() || !mode) return;
        
        if(mode === 'stock') {
            card.classList.toggle('out-of-stock'); card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
        }
        if(mode === 'badge') {
            const type = document.getElementById('badge-selector').value;
            const badgeDiv = card.querySelector('.badge'); badgeDiv.className = 'badge';
            if(type) { card.setAttribute('data-badge', type); badgeDiv.classList.add('badge-' + type); badgeDiv.innerText = translations[currentLang]['badge_' + type]; } 
            else { card.removeAttribute('data-badge'); badgeDiv.innerText = ''; }
        }
        if(mode === 'delete' && confirm("Видалити?")) card.remove();
        if(mode === 'img') {
            const newUrl = prompt("URL нового фото:", card.querySelector('img').src);
            if(newUrl) card.querySelector('img').src = newUrl;
        }
    });

    document.getElementById('add-product-btn').onclick = async () => {
        const cat = document.getElementById('new-prod-cat').value;
        const name = document.getElementById('new-prod-name').value.trim();
        const price = document.getElementById('new-prod-price').value.trim();
        const img = document.getElementById('new-prod-img').value.trim();
        if (!name || !price) return alert("Введіть назву та ціну!");
        
        const catRef = ref(db, `catalog/${cat}`); const snap = await get(catRef);
        let d = snap.val() || { descs: [], prices: [], stock: [], badges: [], imgs: [] };
        d.descs.push(name); d.prices.push(price); d.imgs = d.imgs || []; d.imgs.push(img || ''); d.stock = d.stock || []; d.stock.push(true); d.badges = d.badges || []; d.badges.push("");
        set(catRef, d).then(() => { alert("Додано!"); document.getElementById('new-prod-name').value = ''; document.getElementById('new-prod-price').value = ''; document.getElementById('new-prod-img').value = ''; });
    };

    document.getElementById('save-all').onclick = () => {
        const promises = [];
        categoriesList.forEach(cat => {
            const p = [], d = [], s = [], b = [], im = [];
            document.querySelectorAll(`#grid-${cat} .product-card`).forEach(card => {
                d.push(card.querySelector('.product-desc').innerText);
                p.push(card.querySelector('.price').innerText);
                s.push(!card.classList.contains('out-of-stock'));
                b.push(card.getAttribute('data-badge') || "");
                im.push(card.querySelector('img').src);
            });
            promises.push(set(ref(db, `catalog/${cat}`), { descs: d, prices: p, stock: s, badges: b, imgs: im }));
        });
        Promise.all(promises).then(() => alert("Збережено!"));
    };

    let sortables = [];
    document.getElementById('edit-reorder').onclick = (e) => {
        mode = mode === 'reorder' ? null : 'reorder'; updateModeBtns(e.target);
        if (mode === 'reorder') {
            document.body.classList.add('reorder-mode');
            document.querySelectorAll('.product-grid').forEach(g => sortables.push(new Sortable(g, { animation: 150, delay: 100 })));
        } else {
            document.body.classList.remove('reorder-mode'); sortables.forEach(s => s.destroy()); sortables = [];
        }
    };

    document.getElementById('admin-trigger').onclick = () => {
        if (isAdmin()) document.getElementById('dev-menu').classList.toggle('active');
        else if (prompt("Пароль:") === "smokehub2026") { localStorage.setItem('isHubAdmin', 'true'); location.reload(); }
    };

    // Відображення списку замовлень в Адмінці
    onValue(ref(db, 'orders'), snap => {
        if(!isAdmin()) return;
        const list = document.getElementById('admin-orders-list');
        list.innerHTML = '';
        const data = snap.val();
        if(data) {
            Object.values(data).reverse().forEach(o => {
                const itemsHtml = o.items.map(i => `• ${i.name} <b>x${i.qty}</b>`).join('<br>');
                list.innerHTML += `
                    <div style="background:rgba(255,255,255,0.05); border: 1px solid rgba(0, 240, 255, 0.2); padding:12px; border-radius:12px; font-size:13px;">
                        <div style="color: #aaa; font-size: 10px; margin-bottom: 5px;">${o.date}</div>
                        <b>👤 ${o.user}</b> <br>📞 ${o.contact}<br>📍 Місто: ${o.city || 'Не вказано'}<br>
                        <div style="margin: 8px 0; color: #ccc;">${itemsHtml}</div>
                        💰 Сума: <span style="color:var(--neon-blue); font-weight: bold;">${o.total}</span> | 💳 Оплата в: <b>${o.payCurrency || 'Не вказано'}</b>
                    </div>`;
            });
        } else {
            list.innerHTML = '<div style="color: #888; font-size: 13px;">Поки немає замовлень</div>';
        }
    });

    onValue(ref(db, 'settings/lastUpdate'), (snap) => {
        const date = snap.val() || '24.07.2026';
        const dateEl = document.getElementById('last-update-date'); if (dateEl) dateEl.innerText = date;
        const adminInput = document.getElementById('admin-update-date'); if (adminInput) adminInput.value = date;
    });

    document.getElementById('save-date-btn')?.addEventListener('click', () => {
        if (isAdmin()) {
            const newDate = document.getElementById('admin-update-date').value.trim();
            if(newDate) set(ref(db, 'settings/lastUpdate'), newDate).then(() => alert('Дату оновлено!'));
        }
    });

    onValue(ref(db, 'settings/bannerVisible'), (s) => {
        currentBannerStatus = s.val() !== false;
        const btn = document.getElementById('toggle-banner');
        if(currentBannerStatus) { btn.classList.add('active-mode'); const banner = document.getElementById('main-banner'); if (banner && !document.getElementById('cat-cart').classList.contains('active')) banner.style.display = 'block'; } 
        else { btn.classList.remove('active-mode'); const banner = document.getElementById('main-banner'); if (banner) banner.style.display = 'none'; }
    });
    document.getElementById('toggle-banner').onclick = () => { if (isAdmin()) set(ref(db, 'settings/bannerVisible'), !currentBannerStatus); };

    let currentHideSoldStatus = false;
    onValue(ref(db, 'settings/hideSold'), (s) => {
        currentHideSoldStatus = s.val() === true;
        const btn = document.getElementById('toggle-hide-sold');
        if(currentHideSoldStatus) { document.documentElement.classList.add('hide-sold-active'); btn.classList.add('active-mode'); } 
        else { document.documentElement.classList.remove('hide-sold-active'); btn.classList.remove('active-mode'); }
    });
    document.getElementById('toggle-hide-sold').onclick = () => { if (isAdmin()) set(ref(db, 'settings/hideSold'), !currentHideSoldStatus); };
</script>
</body>
</html>
