    <!DOCTYPE html>
<html lang="uk">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        let myId = localStorage.getItem('hub_user_id');
        if (!myId || myId === 'null') {
            myId = 'User_' + Math.floor(Math.random() * 9000 + 1000);
            localStorage.setItem('hub_user_id', myId);
        }
        if (localStorage.getItem('isHubAdmin') === 'true') {
            document.documentElement.classList.add('force-admin');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMOKE HUB</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">

    <style>
        :root { 
            --bg: #000000;
            --surface: #121212;
            --surface-light: #1c1c1e;
            --border: #2c2c2e;
            --text: #ffffff;
            --text-muted: #8e8e93;
            --accent: #ffffff;
            --accent-bg: #ffffff;
            --accent-text: #000000;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        *::-webkit-scrollbar { display: none !important; }

        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: calc(110px + env(safe-area-inset-bottom)); 
            background-color: var(--bg);
            font-family: var(--font-main);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container { padding: 12px 16px; width: 100%; margin: 0 auto; max-width: 500px; }

        /* HEADER - Мінімалізм */
        header { 
            display: flex; justify-content: center; align-items: center; 
            padding: calc(12px + env(safe-area-inset-top)) 20px 12px; 
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .logo { 
            font-weight: 800; font-size: 18px; letter-spacing: -0.5px;
            text-transform: uppercase; color: var(--text);
        }

        /* КНОПКИ В ШАПЦІ */
        .head-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text); padding: 6px 12px; border-radius: 30px; 
            font-size: 12px; font-weight: 600; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .head-btn:active { transform: scale(0.95); background: var(--surface-light); }

        /* СІТКА ТОВАРІВ */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        /* КАРТКА ТОВАРУ (Стиль Apple) */
        .product-card { 
            background: var(--surface);
            border-radius: 20px; padding: 10px; text-align: left; 
            border: 1px solid var(--border); display: flex; flex-direction: column; 
            position: relative; transition: 0.2s;
        }
        .product-card:active { transform: scale(0.97); }
        
        .product-img { 
            width: 100%; aspect-ratio: 1/1; border-radius: 14px; 
            overflow: hidden; margin-bottom: 12px; position: relative; 
            background: var(--surface-light);
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-desc { 
            font-size: 14px; font-weight: 500; line-height: 1.3; 
            margin: 0 0 12px; color: var(--text); 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }
        
        /* ЦІНА - Контрастна таблетка */
        .price { 
            font-weight: 700; font-size: 13px; margin-top: auto; align-self: flex-start;
            background: var(--accent-bg); color: var(--accent-text);
            padding: 6px 12px; border-radius: 30px;
        }
        
        /* СТІКЕРИ */
        .badge { 
            position: absolute; top: 8px; left: 8px; padding: 4px 10px; 
            border-radius: 30px; font-size: 10px; font-weight: 700; z-index: 5; 
            display: none; text-transform: uppercase; letter-spacing: 0.5px; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #fff; border: 1px solid rgba(255,255,255,0.2);
        }
        .badge-hit { display: block !important; background: rgba(255, 59, 48, 0.9); }
        .badge-promo { display: block !important; background: rgba(255, 149, 0, 0.9); color: #fff;}
        .badge-new { display: block !important; background: rgba(52, 199, 89, 0.9); }
        
        /* SOLD OUT (Виправлено клікабельність) */
        .out-of-stock { opacity: 0.6; filter: grayscale(1); }
        .out-of-stock::after { 
            content: attr(data-out-of-stock-text); position: absolute; 
            top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--surface); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 30px; font-size: 12px; font-weight: 700; 
            color: var(--text-muted); z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* МЕНЮ - Плаваюча таблетка */
        .bottom-nav { 
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); 
            left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 400px;
            background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; 
            padding: 8px; border-radius: 40px;
            z-index: 1000; border: 1px solid var(--border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { 
            background: transparent; border: none; color: var(--text-muted); 
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; gap: 6px;
            padding: 12px 20px; border-radius: 30px; transition: 0.3s;
        }
        .nav-item span:first-child { font-size: 18px; filter: grayscale(1); opacity: 0.7; }
        
        .nav-item.active { 
            background: var(--surface-light); color: var(--text); 
        }
        .nav-item.active span:first-child { filter: grayscale(0); opacity: 1; }

        /* БАНЕР */
        .promo-slider { width: 100%; height: 160px; margin-bottom: 20px; border-radius: 20px; overflow: hidden; position: relative; display: none; }
        .promo-track { display: flex; height: 100%; transition: transform 0.6s ease; }
        .promo-slide { min-width: 100%; position: relative; }
        .promo-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* МОДАЛЬНІ ВІКНА */
        .lang-modal-overlay { 
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(5px); z-index: 1000001; display: none; 
            align-items: center; justify-content: center; opacity: 0; transition: 0.3s;
        }
        .lang-modal-content { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 30px 20px; border-radius: 24px; text-align: center; width: 85%; max-width: 320px; 
            transform: translateY(20px); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .lang-modal-overlay.active { opacity: 1; display: flex; }
        .lang-modal-overlay.active .lang-modal-content { transform: translateY(0); }

        .lang-options { display: grid; gap: 10px; }
        .lang-options button { 
            background: var(--surface-light); color: var(--text); 
            border: 1px solid var(--border); padding: 16px; 
            border-radius: 16px; font-size: 15px; font-weight: 600; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; 
        }
        .lang-options button:active { background: #2c2c2e; transform: scale(0.97); }

        /* АДМІН ПАНЕЛЬ */
        .dev-panel { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; 
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); 
            padding: calc(20px + env(safe-area-inset-top)) 20px 100px; 
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; 
            border-left: 1px solid var(--border); overflow-y: auto;
        }
        .dev-panel.active { right: 0; }
        .admin-section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 12px 4px; }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .admin-btn { background: var(--surface-light); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 16px; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: 0.2s; }
        .admin-btn span { font-size: 20px; }
        .admin-btn.active-mode { background: #fff; color: #000; }
        .admin-input { width: 100%; background: var(--surface-light); border: 1px solid var(--border); padding: 14px; border-radius: 16px; color: white; margin-bottom: 10px; font-size: 14px; outline: none; }
        .admin-input:focus { border-color: var(--text-muted); }
        
        .save-all-btn { grid-column: span 2; background: #fff; color: #000; border: none; padding: 16px; border-radius: 16px; font-weight: 700; margin-top: 8px; font-size: 14px; }

        .hidden { display: none !important; }
        [contenteditable="true"] { outline: 1px dashed var(--text-muted); background: var(--surface-light); border-radius: 6px; padding: 4px; }

        html.hide-sold-active:not(.force-admin) .product-card.out-of-stock { display: none !important; }
        html.force-admin.hide-sold-active .product-card.out-of-stock { display: flex !important; opacity: 0.3; }

        @keyframes jiggle { 0% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } 100% { transform: rotate(-1.5deg); } }
        .reorder-mode .product-card { animation: jiggle 0.3s infinite ease-in-out; }
    </style>
</head>
<body>

<!-- Модалка вибору мови -->
<div id="language-modal" class="lang-modal-overlay">
    <div class="lang-modal-content">
        <div class="logo" style="font-size: 24px; margin-bottom: 10px;">SMOKE HUB</div>
        <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px; font-weight: 500;">Виберіть мову / Wybierz język</h3>
        <div class="lang-options">
            <button onclick="selectInitialLang('ua')">🇺🇦 Українська</button>
            <button onclick="selectInitialLang('pl')">🇵🇱 Polski</button>
        </div>
    </div>
</div>

<!-- Модалка вибору категорії при вході -->
<div id="category-start-modal" class="lang-modal-overlay">
    <div class="lang-modal-content">
        <div class="logo" style="font-size: 24px; margin-bottom: 10px;">SMOKE HUB</div>
        <h3 id="cat-modal-title" style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px; font-weight: 500;">Що вас цікавить? / Co Cię interesuje?</h3>
        <div class="lang-options" style="grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="selectInitialCategory('zalivka')" style="flex-direction: column; padding: 20px 10px;">
                <span style="font-size: 32px; margin-bottom: 8px;">💧</span>
                <span data-i18n="zalivka">Жижа</span>
            </button>
            <button onclick="selectInitialCategory('prodazh')" style="flex-direction: column; padding: 20px 10px;">
                <span style="font-size: 32px; margin-bottom: 8px;">🟢</span>
                <span data-i18n="prodazh">Снюс</span>
            </button>
        </div>
    </div>
</div>

<header>
    <!-- Кнопка мови (Зліва) -->
    <button id="lang-toggle-mini" class="head-btn" style="position: absolute; left: 16px;">
        <span id="lang-flag">🇺🇦</span> <span id="lang-label">UA</span>
    </button>
    
    <div class="logo">SMOKE HUB</div>
    
    <!-- Кнопка адмінки (Справа) -->
    <button id="admin-trigger" class="head-btn" style="position: absolute; right: 16px; border: none; background: transparent; font-size: 18px; padding: 4px;">⚙️</button>
</header>
   
<div class="container" id="main-container">
    <div class="promo-slider" id="main-banner">
        <div class="promo-track" id="promoTrack">
            <div class="promo-slide">
                <img src="images/banner.gif" alt="promo" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <!-- КАТЕГОРІЯ 1: ЖИЖА -->
    <div id="cat-zalivka" class="cat-section">
        <div class="product-grid"></div>
    </div>

    <!-- КАТЕГОРІЯ 2: СНЮС -->
    <div id="cat-prodazh" class="cat-section hidden">
        <div class="product-grid"></div>
    </div>

    <!-- КАТЕГОРІЯ 3: КАТРИДЖІ -->
    <div id="cat-aktsii" class="cat-section hidden">
        <div class="product-grid"></div>
    </div>
</div>

<!-- FLOATING DOCK NAV -->
<nav class="bottom-nav">
    <button class="nav-item active" data-tab="zalivka">
        <span>💧</span><span data-i18n="zalivka">Жижа</span>
    </button>
    <button class="nav-item" data-tab="prodazh">
        <span>🟢</span><span data-i18n="prodazh">Снюс</span>
    </button>
    <button class="nav-item" data-tab="aktsii">
        <span>⚡</span><span data-i18n="other">Катриджі</span>
    </button>
</nav>

<!-- ADMIN PANEL -->
<div id="dev-menu" class="dev-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div class="logo" style="font-size: 18px;">КЕРУВАННЯ</div>
        <button onclick="document.getElementById('dev-menu').classList.remove('active')" style="background:var(--surface-light); border:none; color:white; width: 32px; height: 32px; border-radius: 50%; font-size:16px; cursor: pointer;">✕</button>
    </div>

    <div class="admin-section-title">Додати товар</div>
    <div style="background: var(--surface); padding: 16px; border-radius: 20px; border: 1px solid var(--border);">
        <select id="new-prod-cat" class="admin-input">
            <option value="zalivka">Жижа</option>
            <option value="prodazh">Снюс</option>
            <option value="aktsii">Катриджі</option>
        </select>
        <input type="text" id="new-prod-name" placeholder="Назва" class="admin-input">
        <input type="text" id="new-prod-price" placeholder="Ціна (напр. 60 zł)" class="admin-input">
        <input type="text" id="new-prod-img" placeholder="URL фото" class="admin-input">
        <button class="admin-btn" id="add-product-btn" style="width:100%; background: #fff; color:#000; border:none; flex-direction:row; justify-content:center; margin-top:8px;">
            ДОДАТИ
        </button>
    </div>

    <div class="admin-section-title">Редагування</div>
    <div class="admin-grid">
        <button class="admin-btn" id="edit-price"><span>💰</span>Ціни</button>
        <button class="admin-btn" id="edit-desc"><span>📝</span>Назви</button>
        <button class="admin-btn" id="edit-stock"><span>📦</span>Наявність</button>
        <button class="admin-btn" id="edit-badge"><span>🏷️</span>Стікери</button>
        <button class="admin-btn" id="edit-img-mode"><span>📸</span>Фото</button>
        <button class="admin-btn" id="edit-reorder"><span>↕️</span>Порядок</button>
        <button class="admin-btn" id="edit-delete" style="color: #ff453a;"><span>🗑️</span>Видалити</button>
        
        <select id="badge-selector" class="admin-input" style="grid-column: span 2; margin: 8px 0 0;">
            <option value="">Без стікера</option>
            <option value="hit">ХІТ</option>
            <option value="promo">АКЦІЯ</option>
            <option value="new">НОВИНКА</option>
        </select>
        <button class="save-all-btn" id="save-all">ЗБЕРЕГТИ ЗМІНИ</button>
    </div>

    <div class="admin-section-title">Система</div>
    <div class="admin-grid">
        <button class="admin-btn" id="toggle-hide-sold"><span>🚫</span>Ховати Sold</button>
        <button class="admin-btn" id="toggle-banner"><span>🖼️</span>Банер</button>
    </div>

    <button class="admin-btn" style="width:100%; margin-top:40px; background:transparent; border-color:var(--border); color: var(--text-muted);" onclick="localStorage.clear(); location.reload();">
        Вийти з адмінки
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://smokehub-7a072-default-rtdb.firebaseio.com/" });
    const db = getDatabase(app);
    const isAdmin = () => localStorage.getItem('isHubAdmin') === 'true';

    const translations = {
        ua: { zalivka: "Жижа", prodazh: "Снюс", other: "Катриджі", sold: "ПРОДАНО", badge_hit: "ХІТ", badge_promo: "АКЦІЯ", badge_new: "НОВИНКА" },
        pl: { zalivka: "Liquid", prodazh: "Snus", other: "Kartridże", sold: "SPRZEDANE", badge_hit: "HIT", badge_promo: "PROMOCJA", badge_new: "NOWOŚĆ" }
    };

    let currentLang = localStorage.getItem("lang") || "ua";

    function applyLang(lang) {
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.dataset.i18n;
            if (translations[lang][key]) el.innerText = translations[lang][key];
        });
        document.querySelectorAll('.product-card').forEach(card => {
            card.setAttribute('data-out-of-stock-text', translations[lang].sold);
            const badgeDiv = card.querySelector('.badge');
            const bType = card.getAttribute('data-badge');
            if (bType && translations[lang]['badge_' + bType]) {
                badgeDiv.innerText = translations[lang]['badge_' + bType];
            }
        });
        const langLabel = document.getElementById("lang-label");
        const langFlag = document.getElementById("lang-flag");
        if(langLabel) {
            langLabel.innerText = lang.toUpperCase();
            langFlag.innerText = lang === "ua" ? "🇺🇦" : "🇵🇱";
        }
        localStorage.setItem("lang", lang);
        currentLang = lang;
    }

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.classList.add('active');
    }
    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.style.opacity = '0';
        modal.querySelector('.lang-modal-content').style.transform = 'translateY(20px)';
        setTimeout(() => { modal.classList.remove('active'); modal.style = ''; }, 300);
    }

    window.selectInitialLang = (lang) => {
        applyLang(lang);
        closeModal('language-modal');
        setTimeout(() => openModal('category-start-modal'), 300);
    };

    window.selectInitialCategory = (tab) => {
        closeModal('category-start-modal');
        setTimeout(() => {
            const navBtn = document.querySelector(`.nav-item[data-tab="${tab}"]`);
            if (navBtn) navBtn.click(); 
        }, 300);
    };

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang");
        if (!savedLang) setTimeout(() => openModal('language-modal'), 100);
        else {
            applyLang(savedLang);
            setTimeout(() => openModal('category-start-modal'), 100);
        }
    });

    document.getElementById("lang-toggle-mini")?.addEventListener("click", () => {
        currentLang = currentLang === "ua" ? "pl" : "ua";
        applyLang(currentLang);
    });

    let currentBannerStatus = true;
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.cat-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('cat-' + tab).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            
            const banner = document.getElementById('main-banner');
            if (banner) banner.style.display = (!currentBannerStatus) ? 'none' : 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    });

    onValue(ref(db, 'catalog'), (snap) => {
        const data = snap.val();
        if (!data) return;

        ['zalivka', 'prodazh', 'aktsii'].forEach(cat => {
            const grid = document.querySelector(`#cat-${cat} .product-grid`);
            if (!grid) return;
            grid.innerHTML = ''; 
            
            const catData = data[cat];
            if (catData && catData.descs) {
                catData.descs.forEach((name, i) => {
                    const card = document.createElement('div');
                    card.className = `product-card ${catData.stock?.[i] === false ? 'out-of-stock' : ''}`;
                    const bType = catData.badges?.[i];
                    if (bType) card.setAttribute('data-badge', bType);
                    card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
                    const badgeHtml = bType ? `<div class="badge badge-${bType}">${translations[currentLang]['badge_' + bType] || ""}</div>` : '<div class="badge"></div>';

                    card.innerHTML = `
                        <div class="product-img">${badgeHtml}<img src="${catData.imgs?.[i] || 'images/logo.png'}"></div>
                        <h3 class="product-desc">${name}</h3>
                        <div class="price">${catData.prices?.[i] || ""}</div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    });

    let mode = null;
    function updateModeBtns(activeBtn) {
        document.querySelectorAll('.admin-btn').forEach(b => b.classList.remove('active-mode'));
        if (mode) activeBtn.classList.add('active-mode');
    }

    document.getElementById('edit-price').onclick = (e) => { mode = mode === 'price' ? null : 'price'; document.querySelectorAll('.price').forEach(el => el.contentEditable = (mode === 'price')); updateModeBtns(e.target); };
    document.getElementById('edit-desc').onclick = (e) => { mode = mode === 'desc' ? null : 'desc'; document.querySelectorAll('.product-desc').forEach(el => el.contentEditable = (mode === 'desc')); updateModeBtns(e.target); };
    document.getElementById('edit-stock').onclick = (e) => { mode = mode === 'stock' ? null : 'stock'; updateModeBtns(e.target); };
    document.getElementById('edit-badge').onclick = (e) => { mode = mode === 'badge' ? null : 'badge'; updateModeBtns(e.target); };
    document.getElementById('edit-img-mode').onclick = (e) => { mode = mode === 'img' ? null : 'img'; updateModeBtns(e.target); };
    document.getElementById('edit-delete').onclick = (e) => { mode = mode === 'delete' ? null : 'delete'; updateModeBtns(e.target); };

    document.addEventListener('click', (e) => {
        const card = e.target.closest('.product-card');
        if(!card || !isAdmin()) return;
        
        if(mode === 'stock') {
            card.classList.toggle('out-of-stock');
            card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
        }
        if(mode === 'badge') {
            const type = document.getElementById('badge-selector').value;
            const badgeDiv = card.querySelector('.badge');
            badgeDiv.className = 'badge';
            if(type) {
                card.setAttribute('data-badge', type);
                badgeDiv.classList.add('badge-' + type);
                badgeDiv.innerText = translations[currentLang]['badge_' + type];
            } else {
                card.removeAttribute('data-badge');
                badgeDiv.innerText = '';
            }
        }
        if(mode === 'delete' && confirm("Видалити?")) card.remove();
        if(mode === 'img') {
            const newUrl = prompt("URL нового фото:", card.querySelector('img').src);
            if(newUrl) card.querySelector('img').src = newUrl;
        }
    });

    document.getElementById('add-product-btn').onclick = async () => {
        const cat = document.getElementById('new-prod-cat').value;
        const name = document.getElementById('new-prod-name').value.trim();
        const price = document.getElementById('new-prod-price').value.trim();
        const img = document.getElementById('new-prod-img').value.trim();
        if (!name || !price) return alert("Введіть назву та ціну!");
        
        const catRef = ref(db, `catalog/${cat}`);
        const snap = await get(catRef);
        let d = snap.val() || { descs: [], prices: [], stock: [], badges: [], imgs: [] };
        d.descs.push(name); d.prices.push(price); d.imgs = d.imgs || []; d.imgs.push(img || ''); d.stock = d.stock || []; d.stock.push(true); d.badges = d.badges || []; d.badges.push("");
        set(catRef, d).then(() => { alert("Успіх!"); });
    };

    document.getElementById('save-all').onclick = () => {
        const fullData = {};
        ['zalivka', 'prodazh', 'aktsii'].forEach(cat => {
            const p = [], d = [], s = [], b = [], im = [];
            document.querySelectorAll(`#cat-${cat} .product-card`).forEach(card => {
                d.push(card.querySelector('.product-desc').innerText);
                p.push(card.querySelector('.price').innerText);
                s.push(!card.classList.contains('out-of-stock'));
                b.push(card.getAttribute('data-badge') || "");
                im.push(card.querySelector('img').src);
            });
            fullData[cat] = { descs: d, prices: p, stock: s, badges: b, imgs: im };
        });
        set(ref(db, 'catalog'), fullData).then(() => alert("Збережено!"));
    };

    let sortables = [];
    document.getElementById('edit-reorder').onclick = (e) => {
        mode = mode === 'reorder' ? null : 'reorder';
        updateModeBtns(e.target);
        if (mode === 'reorder') {
            document.body.classList.add('reorder-mode');
            document.querySelectorAll('.product-grid').forEach(g => sortables.push(new Sortable(g, { animation: 150, delay: 100 })));
        } else {
            document.body.classList.remove('reorder-mode');
            sortables.forEach(s => s.destroy()); sortables = [];
        }
    };

    document.getElementById('admin-trigger').onclick = () => {
        if (isAdmin()) document.getElementById('dev-menu').classList.toggle('active');
        else if (prompt("Пароль:") === "smokehub2026") { localStorage.setItem('isHubAdmin', 'true'); location.reload(); }
    };

    onValue(ref(db, 'settings/bannerVisible'), (s) => currentBannerStatus = s.val() !== false);
    onValue(ref(db, 'settings/hideSold'), (s) => document.documentElement.classList.toggle('hide-sold-active', s.val() === true));
</script>
</body>
</html>
