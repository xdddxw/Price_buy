    <!DOCTYPE html>
<html lang="uk">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        let myId = localStorage.getItem('hub_user_id');
        if (!myId || myId === 'null') {
            myId = 'User_' + Math.floor(Math.random() * 9000 + 1000);
            localStorage.setItem('hub_user_id', myId);
        }
        if (localStorage.getItem('isHubAdmin') === 'true') {
            document.documentElement.classList.add('force-admin');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMOKE HUB PRO</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMOKE HUB">
    <meta name="theme-color" content="#030305">
    
    <!-- Преміальний шрифт Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --bg-color: #050508; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neon-pink: #ff0055; 
            --neon-blue: #00f0ff; 
            --neon-purple: #7000ff;
            --font-main: 'Outfit', sans-serif;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        *::-webkit-scrollbar { display: none !important; }

        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: calc(110px + env(safe-area-inset-bottom)); 
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            font-family: var(--font-main);
            color: #ffffff;
            -webkit-overflow-scrolling: touch;
        }

        .container { padding: 16px; width: 100%; margin: 0 auto; max-width: 600px; }

        /* HEADER - Floating Effect */
        header { 
            display: flex; justify-content: center; align-items: center; 
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px; 
            background: linear-gradient(180deg, rgba(5,5,8,0.9) 0%, rgba(5,5,8,0) 100%);
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { 
            font-weight: 900; font-size: 24px; letter-spacing: 2px;
            text-transform: uppercase; 
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue), var(--neon-purple)); 
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: gradient-move 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
        }
        @keyframes gradient-move { to { background-position: 200% center; } }

        /* HEADER BUTTONS */
        .head-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white; padding: 8px 12px; border-radius: 14px; 
            font-size: 13px; font-weight: 700; font-family: var(--font-main);
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.2s;
        }
        .head-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        /* PRODUCT CARDS */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .product-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 24px; padding: 12px; text-align: center; 
            border: 1px solid var(--glass-border); display: flex; flex-direction: column; 
            position: relative; backdrop-filter: blur(15px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .product-card:active { transform: scale(0.96); border-color: rgba(0, 240, 255, 0.3); }
        .product-img { 
            width: 100%; aspect-ratio: 1/1; border-radius: 18px; 
            overflow: hidden; margin-bottom: 12px; position: relative; 
            background: #0a0a0f; 
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .product-img img { transform: scale(1.05); }
        
        .product-desc { 
            font-size: 14px; font-weight: 500; min-height: 36px; line-height: 1.2; 
            margin: 0 0 10px; color: #e0e0e0; display: -webkit-box; 
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }
        .price { 
            font-weight: 900; font-size: 16px; margin-top: auto; 
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            padding: 8px; border-radius: 12px; background-color: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.1);
        }
        
        /* BADGES */
        .badge { 
            position: absolute; top: 10px; left: 10px; padding: 5px 12px; 
            border-radius: 10px; font-size: 10px; font-weight: 900; z-index: 5; 
            display: none; text-transform: uppercase; color: white; letter-spacing: 1px; 
            backdrop-filter: blur(5px);
        }
        .badge-hit { display: block !important; background: linear-gradient(135deg, var(--neon-pink), #ff5e00); box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); }
        .badge-promo { display: block !important; background: linear-gradient(135deg, #ffd900, #ff8c00); color: #000; box-shadow: 0 4px 15px rgba(255, 217, 0, 0.3); }
        .badge-new { display: block !important; background: linear-gradient(135deg, #00ff99, #00ccff); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); color: #000;}
        
        /* SOLD OUT EFFECT */
        .out-of-stock { pointer-events: none; }
        .out-of-stock .product-img::after {
            content: ''; position: absolute; inset: 0; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 8;
        }
        .out-of-stock::after { 
            content: attr(data-out-of-stock-text); position: absolute; 
            top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); 
            background: rgba(255, 0, 85, 0.15); border: 1px solid var(--neon-pink);
            padding: 8px 18px; border-radius: 14px; font-size: 13px; font-weight: 900; 
            color: var(--neon-pink); z-index: 10; backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255,0,85,0.4); text-transform: uppercase;
        }

        /* FLOATING BOTTOM NAV */
        .bottom-nav { 
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); 
            left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px;
            background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; 
            padding: 10px; border-radius: 28px;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02) inset;
        }
        .nav-item { 
            background: transparent; border: none; color: #666; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; gap: 8px; font-family: var(--font-main);
            padding: 12px 18px; border-radius: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item span:first-child { font-size: 20px; filter: grayscale(1); opacity: 0.5; transition: 0.3s; }
        
        .nav-item.active { 
            background: rgba(255,255,255,0.08); color: #fff; 
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .nav-item.active span:first-child { filter: grayscale(0); opacity: 1; transform: scale(1.15); }

        /* BANNER */
        .promo-slider { width: 100%; height: 160px; margin-bottom: 24px; border-radius: 28px; overflow: hidden; position: relative; border: 1px solid var(--glass-border); box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; }
        .promo-track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .promo-slide { min-width: 100%; position: relative; }
        .promo-slide img { width: 100%; height: 100%; object-fit: cover; }
        .promo-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,8,0.8) 0%, transparent 100%); }

        /* MODALS (ANIMATED) */
        .lang-modal-overlay { 
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(15px); z-index: 1000001; display: none; 
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .lang-modal-content { 
            background: rgba(15, 15, 20, 0.8); border: 1px solid var(--glass-border); 
            padding: 32px 24px; border-radius: 32px; text-align: center; width: 85%; max-width: 340px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); 
            transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lang-modal-overlay.active { opacity: 1; display: flex; }
        .lang-modal-overlay.active .lang-modal-content { transform: scale(1); }

        .lang-options { display: grid; gap: 14px; }
        .lang-options button { 
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); 
            color: white; border: 1px solid var(--glass-border); padding: 18px; 
            border-radius: 20px; font-size: 16px; font-weight: 700; font-family: var(--font-main);
            display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.2s; 
        }
        .lang-options button:active { background: rgba(255,255,255,0.1); transform: scale(0.95); border-color: rgba(255,255,255,0.2); }

        /* ADMIN PANEL */
        .dev-panel { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; 
            background: rgba(10, 10, 14, 0.95); backdrop-filter: blur(25px); padding: calc(24px + env(safe-area-inset-top)) 24px 100px; 
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; 
            border-left: 1px solid rgba(255, 255, 255, 0.05); overflow-y: auto; box-shadow: -20px 0 50px rgba(0,0,0,0.8);
        }
        .dev-panel.active { right: 0; }
        .admin-section-title { font-size: 11px; font-weight: 900; color: #666; text-transform: uppercase; letter-spacing: 2px; margin: 24px 0 16px; display: flex; align-items: center; gap: 10px; }
        .admin-section-title::after { content: ''; height: 1px; flex: 1; background: rgba(255,255,255,0.05); }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .admin-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); color: #ccc; padding: 16px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--font-main); transition: 0.2s; }
        .admin-btn span { font-size: 20px; }
        .admin-btn.active-mode { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        .admin-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 16px; color: white; margin-bottom: 12px; font-size: 14px; font-family: var(--font-main); font-weight: 500; outline: none; }
        .admin-input:focus { border-color: var(--neon-blue); }
        
        .save-all-btn { grid-column: span 2; background: linear-gradient(90deg, var(--neon-blue), #0077ff); color: #fff; border: none; padding: 18px; border-radius: 20px; font-weight: 900; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; box-shadow: 0 10px 20px rgba(0, 119, 255, 0.3); }

        .hidden { display: none !important; }
        [contenteditable="true"] { outline: none; background: rgba(0, 240, 255, 0.1); border-radius: 8px; padding: 4px; box-shadow: inset 0 0 0 1px var(--neon-blue); }

        html.hide-sold-active:not(.force-admin) .product-card.out-of-stock { display: none !important; }
        html.force-admin.hide-sold-active .product-card.out-of-stock { display: flex !important; opacity: 0.3; }

        @keyframes jiggle { 0% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } 100% { transform: rotate(-1.5deg); } }
        .reorder-mode .product-card { animation: jiggle 0.35s infinite ease-in-out; }
    </style>
</head>

<!-- Модалка вибору мови -->
<div id="language-modal" class="lang-modal-overlay">
    <div class="lang-modal-content">
        <div class="logo" style="font-size: 28px; margin-bottom: 15px;">SMOKE HUB</div>

</div>

<!-- Модалка вибору категорії при вході -->

</div>

<header>
    <!-- Кнопка мови (Зліва) -->
    <button id="lang-toggle-mini" class="head-btn" style="position: absolute; left: 20px; display: flex; align-items: center; gap: 6px;">

    <div class="logo">SMOKE HUB</div>

</header>
   
<div class="container" id="main-container">

        <div class="promo-track" id="promoTrack">
            <div class="promo-slide">
                <img src="images/banner.gif" alt="promo" onerror="this.style.display='none'">
                <div class="promo-overlay"></div>
            </div>
        </div>
    </div>

    <!-- КАТЕГОРІЯ 1: ЖИЖА -->

<!-- FLOATING DOCK NAV -->

    <button class="nav-item" data-tab="prodazh">

        <span>⚡</span><span data-i18n="other">Катриджі</span>

<!-- ADMIN PANEL -->
<div id="dev-menu" class="dev-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <div class="logo" style="font-size: 22px;">HUB CONTROL</div>
        <button onclick="document.getElementById('dev-menu').classList.remove('active')" style="background:rgba(255,255,255,0.1); border:none; color:white; width: 36px; height: 36px; border-radius: 50%; font-size:18px; cursor: pointer; backdrop-filter: blur(10px);">×</button>
    </div>

    <div class="admin-section-title">🆕 Додати товар</div>

        🚪 Вийти з адмінки
    </button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://smokehub-7a072-default-rtdb.firebaseio.com/" });
    const db = getDatabase(app);
    const isAdmin = () => localStorage.getItem('isHubAdmin') === 'true';

    // --- ЛОКАЛІЗАЦІЯ ---
    const translations = {
        ua: { zalivka: "Жижа", prodazh: "Снюс", other: "Катриджі", sold: "ПРОДАНО", badge_hit: "ХІТ", badge_promo: "АКЦІЯ", badge_new: "НОВИНКА" },
        pl: { zalivka: "Liquid", prodazh: "Snus", other: "Kartridże", sold: "SPRZEDANE", badge_hit: "HIT", badge_promo: "PROMOCJA", badge_new: "NOWOŚĆ" }
    };

    let currentLang = localStorage.getItem("lang") || "ua";

    function applyLang(lang) {
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.dataset.i18n;
            if (translations[lang][key]) el.innerText = translations[lang][key];
        });
        document.querySelectorAll('.product-card').forEach(card => {
            card.setAttribute('data-out-of-stock-text', translations[lang].sold);
            const badgeDiv = card.querySelector('.badge');
            const bType = card.getAttribute('data-badge');
            if (bType && translations[lang]['badge_' + bType]) {
                badgeDiv.innerText = translations[lang]['badge_' + bType];
            }
        });
        const langLabel = document.getElementById("lang-label");
        const langFlag = document.getElementById("lang-flag");
        if(langLabel) {
            langLabel.innerText = lang.toUpperCase();
            langFlag.innerText = lang === "ua" ? "🇺🇦" : "🇵🇱";
        }
        localStorage.setItem("lang", lang);
        currentLang = lang;
    }

    // --- МОДАЛКИ (З анімацією) ---
    function openModal(id) {
        const modal = document.getElementById(id);
        modal.classList.add('active');
    }
    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.style.opacity = '0';
        modal.querySelector('.lang-modal-content').style.transform = 'scale(0.9)';
        setTimeout(() => { modal.classList.remove('active'); modal.style = ''; }, 300);
    }

    window.selectInitialLang = (lang) => {
        applyLang(lang);
        closeModal('language-modal');
        setTimeout(() => openModal('category-start-modal'), 300);
    };

    window.selectInitialCategory = (tab) => {
        closeModal('category-start-modal');
        setTimeout(() => {
            const navBtn = document.querySelector(`.nav-item[data-tab="${tab}"]`);
            if (navBtn) navBtn.click(); 
        }, 300);
    };

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang");
        if (!savedLang) setTimeout(() => openModal('language-modal'), 100);
        else {
            applyLang(savedLang);
            setTimeout(() => openModal('category-start-modal'), 100);
        }
    });

    document.getElementById("lang-toggle-mini")?.addEventListener("click", () => {
        currentLang = currentLang === "ua" ? "pl" : "ua";
        applyLang(currentLang);
    });

    // --- НАВІГАЦІЯ ---
    let currentBannerStatus = true;
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.cat-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('cat-' + tab).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            
            const banner = document.getElementById('main-banner');
            if (banner) banner.style.display = (!currentBannerStatus) ? 'none' : 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    });

    // --- FIREBASE РЕНДЕР КАТАЛОГУ ---
    onValue(ref(db, 'catalog'), (snap) => {
        const data = snap.val();
        if (!data) return;

        ['zalivka', 'prodazh', 'aktsii'].forEach(cat => {
            const grid = document.querySelector(`#cat-${cat} .product-grid`);
            if (!grid) return;
            grid.innerHTML = ''; 
            
            const catData = data[cat];
            if (catData && catData.descs) {
                catData.descs.forEach((name, i) => {
                    const card = document.createElement('div');
                    card.className = `product-card ${catData.stock?.[i] === false ? 'out-of-stock' : ''}`;
                    const bType = catData.badges?.[i];
                    if (bType) card.setAttribute('data-badge', bType);
                    card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
                    const badgeHtml = bType ? `<div class="badge badge-${bType}">${translations[currentLang]['badge_' + bType] || ""}</div>` : '<div class="badge"></div>';

                    card.innerHTML = `
                        <div class="product-img">${badgeHtml}<img src="${catData.imgs?.[i] || 'images/logo.png'}"></div>
                        <h3 class="product-desc">${name}</h3>
                        <div class="price">${catData.prices?.[i] || ""}</div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    });

    // --- АДМІНКА: РЕДАГУВАННЯ ---
    let mode = null;
    function updateModeBtns(activeBtn) {
        document.querySelectorAll('.admin-btn').forEach(b => b.classList.remove('active-mode'));
        if (mode) activeBtn.classList.add('active-mode');
    }

    document.getElementById('edit-price').onclick = (e) => { mode = mode === 'price' ? null : 'price'; document.querySelectorAll('.price').forEach(el => el.contentEditable = (mode === 'price')); updateModeBtns(e.target); };
    document.getElementById('edit-desc').onclick = (e) => { mode = mode === 'desc' ? null : 'desc'; document.querySelectorAll('.product-desc').forEach(el => el.contentEditable = (mode === 'desc')); updateModeBtns(e.target); };
    document.getElementById('edit-stock').onclick = (e) => { mode = mode === 'stock' ? null : 'stock'; updateModeBtns(e.target); };
    document.getElementById('edit-badge').onclick = (e) => { mode = mode === 'badge' ? null : 'badge'; updateModeBtns(e.target); };
    document.getElementById('edit-img-mode').onclick = (e) => { mode = mode === 'img' ? null : 'img'; updateModeBtns(e.target); };
    document.getElementById('edit-delete').onclick = (e) => { mode = mode === 'delete' ? null : 'delete'; updateModeBtns(e.target); };

    document.addEventListener('click', (e) => {
        const card = e.target.closest('.product-card');
        if(!card || !isAdmin()) return;
        
        if(mode === 'stock') {
            card.classList.toggle('out-of-stock');
            card.setAttribute('data-out-of-stock-text', translations[currentLang].sold);
        }
        if(mode === 'badge') {
            const type = document.getElementById('badge-selector').value;
            const badgeDiv = card.querySelector('.badge');
            badgeDiv.className = 'badge';
            if(type) {
                card.setAttribute('data-badge', type);
                badgeDiv.classList.add('badge-' + type);
                badgeDiv.innerText = translations[currentLang]['badge_' + type];
            } else {
                card.removeAttribute('data-badge');
                badgeDiv.innerText = '';
            }
        }
        if(mode === 'delete' && confirm("Видалити?")) card.remove();
        if(mode === 'img') {
            const newUrl = prompt("URL нового фото:", card.querySelector('img').src);
            if(newUrl) card.querySelector('img').src = newUrl;
        }
    });

    document.getElementById('add-product-btn').onclick = async () => {
        const cat = document.getElementById('new-prod-cat').value;
        const name = document.getElementById('new-prod-name').value.trim();
        const price = document.getElementById('new-prod-price').value.trim();
        const img = document.getElementById('new-prod-img').value.trim();
        if (!name || !price) return alert("Введіть назву та ціну!");
        
        const catRef = ref(db, `catalog/${cat}`);
        const snap = await get(catRef);
        let d = snap.val() || { descs: [], prices: [], stock: [], badges: [], imgs: [] };
        d.descs.push(name); d.prices.push(price); d.imgs = d.imgs || []; d.imgs.push(img || ''); d.stock = d.stock || []; d.stock.push(true); d.badges = d.badges || []; d.badges.push("");
        set(catRef, d).then(() => { alert("Успіх!"); });
    };

    document.getElementById('save-all').onclick = () => {
        const fullData = {};
        ['zalivka', 'prodazh', 'aktsii'].forEach(cat => {
            const p = [], d = [], s = [], b = [], im = [];
            document.querySelectorAll(`#cat-${cat} .product-card`).forEach(card => {
                d.push(card.querySelector('.product-desc').innerText);
                p.push(card.querySelector('.price').innerText);
                s.push(!card.classList.contains('out-of-stock'));
                b.push(card.getAttribute('data-badge') || "");
                im.push(card.querySelector('img').src);
            });
            fullData[cat] = { descs: d, prices: p, stock: s, badges: b, imgs: im };
        });
        set(ref(db, 'catalog'), fullData).then(() => alert("Збережено!"));
    };

    let sortables = [];
    document.getElementById('edit-reorder').onclick = (e) => {
        mode = mode === 'reorder' ? null : 'reorder';
        updateModeBtns(e.target);
        if (mode === 'reorder') {
            document.body.classList.add('reorder-mode');
            document.querySelectorAll('.product-grid').forEach(g => sortables.push(new Sortable(g, { animation: 150, delay: 100 })));
        } else {
            document.body.classList.remove('reorder-mode');
            sortables.forEach(s => s.destroy()); sortables = [];
        }
    };

    // --- ВХІД / НАЛАШТУВАННЯ ---
    document.getElementById('admin-trigger').onclick = () => {
        if (isAdmin()) document.getElementById('dev-menu').classList.toggle('active');
        else if (prompt("Пароль:") === "smokehub2026") { localStorage.setItem('isHubAdmin', 'true'); location.reload(); }
    };

    onValue(ref(db, 'settings/bannerVisible'), (s) => currentBannerStatus = s.val() !== false);
    onValue(ref(db, 'settings/hideSold'), (s) => document.documentElement.classList.toggle('hide-sold-active', s.val() === true));
</script>
</body>
</html>
